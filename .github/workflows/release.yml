name: Release

on:
  push:
    tags:
      - 'v*' # 当推送以 v 开头的 tag 时触发，例如 v1.0.0

permissions:
  contents: write # 必须赋予写权限，否则无法创建和上传 Release 产物

jobs:
  publish:
    name: Publish for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: transfer-linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact_name: transfer-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: transfer-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: transfer-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: transfer-windows-amd64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 使用 taiki-e 的 action 自动进行 cargo build --release 并上传到 Release
      - name: Upload artifact to GitHub Release
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          # 需要在 Cargo.toml 的 [package] 中定义的 bin 名字
          bin: transfer 
          # 最终在 Release 页面显示的文件名
          archive: ${{ matrix.artifact_name }}
          target: ${{ matrix.target }}
          # 自动引用当前的 Tag 创建/追加到 Release 页面
          token: ${{ secrets.GITHUB_TOKEN }}